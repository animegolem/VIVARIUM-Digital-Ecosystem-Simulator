<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main gradient for depth -->
    <radialGradient id="depthGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#0f1628"/>
      <stop offset="60%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    
    <!-- Subtle green bioluminescence -->
    <radialGradient id="bioGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff4110"/>
      <stop offset="100%" stop-color="#00ff4100"/>
    </radialGradient>
    
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#00000000"/>
      <stop offset="100%" stop-color="#000000cc"/>
    </radialGradient>
    
    <!-- Organic cell membrane filter -->
    <filter id="membrane" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Spore/particle pattern -->
    <pattern id="spores" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="20" r="0.5" fill="#00ff4108"/>
      <circle cx="45" cy="10" r="0.8" fill="#00ff4106"/>
      <circle cx="80" cy="35" r="0.4" fill="#00ff4108"/>
      <circle cx="25" cy="70" r="0.6" fill="#00ff4105"/>
      <circle cx="60" cy="85" r="0.5" fill="#00ff4107"/>
      <circle cx="90" cy="60" r="0.7" fill="#00ff4104"/>
      <circle cx="5" cy="90" r="0.4" fill="#00ff4106"/>
      <circle cx="70" cy="50" r="0.3" fill="#00ff4108"/>
    </pattern>
    
    <!-- Organic tendril path for edges -->
    <linearGradient id="tendrilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff4100"/>
      <stop offset="50%" stop-color="#00ff4115"/>
      <stop offset="100%" stop-color="#00ff4100"/>
    </linearGradient>
  </defs>
  
  <!-- Base layer - deep space/water -->
  <rect width="100%" height="100%" fill="url(#depthGlow)"/>
  
  <!-- Floating spore particles -->
  <rect width="100%" height="100%" fill="url(#spores)" opacity="0.8"/>
  
  <!-- Central bio-luminescent glow -->
  <ellipse cx="600" cy="400" rx="500" ry="350" fill="url(#bioGlow)"/>
  
  <!-- Organic edge formations - like moss or algae growing on terrarium walls -->
  <g opacity="0.4" filter="url(#membrane)">
    <!-- Top edge organic matter -->
    <path d="M0,0 Q150,30 300,15 T600,25 T900,10 T1200,0 L1200,60 Q1000,40 800,55 T400,45 T0,50 Z" 
          fill="#00ff4112"/>
    
    <!-- Bottom edge organic matter -->
    <path d="M0,800 Q200,770 400,785 T800,775 T1200,800 L1200,750 Q950,770 700,755 T300,765 T0,745 Z" 
          fill="#00ff4110"/>
    
    <!-- Left edge -->
    <path d="M0,0 Q25,150 15,300 T20,500 T10,700 T0,800 L50,800 Q40,600 55,400 T45,200 T60,0 Z" 
          fill="#00ff4108"/>
    
    <!-- Right edge -->
    <path d="M1200,0 Q1175,200 1185,400 T1180,600 T1190,800 L1150,800 Q1160,550 1145,350 T1155,150 T1140,0 Z" 
          fill="#00ff4108"/>
  </g>
  
  <!-- Corner organic clusters - like lichen -->
  <g filter="url(#softGlow)">
    <!-- Top left cluster -->
    <circle cx="30" cy="30" r="25" fill="#00ff4108"/>
    <circle cx="60" cy="50" r="15" fill="#00ff4106"/>
    <circle cx="45" cy="70" r="10" fill="#00ff4105"/>
    <circle cx="80" cy="25" r="8" fill="#00ff4107"/>
    
    <!-- Top right cluster -->
    <circle cx="1170" cy="35" r="20" fill="#00ff4107"/>
    <circle cx="1140" cy="60" r="12" fill="#00ff4105"/>
    <circle cx="1155" cy="20" r="8" fill="#00ff4106"/>
    
    <!-- Bottom left cluster -->
    <circle cx="40" cy="770" r="22" fill="#00ff4108"/>
    <circle cx="70" cy="750" r="14" fill="#00ff4106"/>
    <circle cx="25" cy="740" r="10" fill="#00ff4105"/>
    
    <!-- Bottom right cluster -->
    <circle cx="1165" cy="765" r="18" fill="#00ff4107"/>
    <circle cx="1135" cy="745" r="12" fill="#00ff4105"/>
    <circle cx="1175" cy="735" r="8" fill="#00ff4106"/>
  </g>
  
  <!-- Subtle cellular division lines - like looking through a microscope -->
  <g stroke="#00ff4106" stroke-width="0.5" fill="none" opacity="0.5">
    <path d="M200,0 Q220,200 180,400 T220,800"/>
    <path d="M500,0 Q480,300 520,500 T490,800"/>
    <path d="M800,0 Q820,250 780,450 T810,800"/>
    <path d="M1000,0 Q980,200 1020,400 T990,800"/>
    
    <path d="M0,200 Q300,180 600,220 T1200,190"/>
    <path d="M0,450 Q400,470 700,430 T1200,460"/>
    <path d="M0,650 Q350,630 650,670 T1200,640"/>
  </g>
  
  <!-- Central observation area highlight -->
  <ellipse cx="600" cy="400" rx="400" ry="280" 
           fill="none" stroke="#00ff4108" stroke-width="1" 
           stroke-dasharray="4,8" opacity="0.3"/>
  
  <!-- Vignette overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  
  <!-- Scanline effect overlay -->
  <defs>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#scanlines)"/>
</svg>