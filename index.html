<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVARIUM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>🔬 VIVARIUM</h1>
            <p class="subtitle">A Living Digital Ecosystem</p>
        </header>

        <main class="main-content">
            <div class="canvas-container">
                <canvas id="ecosystem-canvas"></canvas>
                <div id="pause-indicator" class="pause-overlay hidden">⏸ PAUSED</div>
            </div>

            <aside class="sidebar">
                <section class="panel">
                    <h3>Simulation</h3>
                    <div class="button-row">
                        <button id="pause-btn" class="btn">⏸ Pause</button>
                        <button id="reset-btn" class="btn btn-danger">↺ Reset</button>
                    </div>
                    <div class="speed-control">
                        <label>Speed: <span id="speed-display">1x</span></label>
                        <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1">
                    </div>
                </section>

                <section class="panel">
                    <h3>Population</h3>
                    <div id="population-stats" class="stats-grid"></div>
                </section>

                <section class="panel">
                    <h3>Environment</h3>
                    <div class="button-row">
                        <button id="add-food-btn" class="btn btn-success">🌱 Food</button>
                        <button id="add-creature-btn" class="btn btn-info">+ Creature</button>
                    </div>
                    <div class="env-stats">
                        <div class="stat-row">
                            <span>Food</span>
                            <span id="food-count">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Time</span>
                            <span id="time-elapsed">0s</span>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <h3>Inspector</h3>
                    <div id="info-panel">
                        <p class="hint">Click a creature to inspect it</p>
                    </div>
                </section>

                <section class="panel species-guide">
                    <h3>Species</h3>
                    <div class="species-item herbivore">
                        <strong>🌿 Herbivore</strong>
                        <p>Peaceful grazers</p>
                    </div>
                    <div class="species-item carnivore">
                        <strong>🔴 Carnivore</strong>
                        <p>Apex predators</p>
                    </div>
                    <div class="species-item scavenger">
                        <strong>🟡 Scavenger</strong>
                        <p>Opportunistic feeders</p>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <script src="event-log.js"></script>
    <script type="module" src="vivarium.js"></script>
</body>
</html>
