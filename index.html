<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVARIUM - Digital Ecosystem Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 VIVARIUM</h1>
            <p class="subtitle">A Living Digital Ecosystem</p>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="ecosystem-canvas" draggable="false"></canvas>
                <div class="canvas-overlay">
                    <div id="pause-indicator" class="hidden">⏸ PAUSED</div>
                </div>
            </div>

            <div class="control-panel">
                <div class="panel-section">
                    <h3>⏱ Simulation</h3>
                    <div class="controls">
                        <button id="pause-btn" class="btn">⏸ Pause</button>
                        <button id="reset-btn" class="btn btn-danger">🔄 Reset</button>
                    </div>
                    <div class="speed-control">
                        <label>Speed: <span id="speed-display">1x</span></label>
                        <input type="range" id="speed-slider" min="0.5" max="5" step="0.5" value="1">
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📊 Population</h3>
                    <div id="population-stats" class="stats-grid"></div>
                </div>

                <div class="panel-section">
                    <h3>🌍 Environment</h3>
                    <div class="controls">
                        <button id="add-food-btn" class="btn btn-success">🌱 Add Plants</button>
                        <button id="add-creature-btn" class="btn btn-info">➕ Add Creature</button>
                    </div>
                    <div class="environment-stats">
                        <div class="stat-item">
                            <span>Food:</span>
                            <span id="food-count">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Generation:</span>
                            <span id="generation-count">1</span>
                        </div>
                        <div class="stat-item">
                            <span>Time Elapsed:</span>
                            <span id="time-elapsed">0s</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📖 Species Guide</h3>
                    <div id="species-guide" class="species-list"></div>
                </div>

                <div class="panel-section">
                    <h3>ℹ️ Info</h3>
                    <div id="info-panel" class="info-text">
                        Click on creatures to see their stats!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="vivarium.js"></script>
</body>
</html>
